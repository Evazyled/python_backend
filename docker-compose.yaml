services:
  backend:
    build: . 
    ports:
      - "8000:8000" #порт внешний , открыть в браузере /docs: порт внутри контейнера
    depends_on:
      - postgres
      - redis
  redis:
    image: redis:8-alpine
    container_name: dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
   image: postgres:18-alpine
   ports:
      - "5432:5432"
   environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
   volumes:
      - postgres_data:/var/lib/postgresql/18/docker

volumes:
  postgres_data:
  redisdata: